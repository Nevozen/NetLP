name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lpstacks_ci
          POSTGRES_PASSWORD: isolated-ci-fixture
          POSTGRES_DB: lpstacks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lpstacks_ci -d lpstacks_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LPSTACKS_TEST_DATABASE_URL: postgresql://lpstacks_ci:isolated-ci-fixture@127.0.0.1:5432/lpstacks_test
      LPSTACKS_E2E_DATABASE_URL: postgresql://lpstacks_ci:isolated-ci-fixture@127.0.0.1:5432/lpstacks_e2e
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Prepare isolated test databases
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U lpstacks_ci lpstacks_e2e
          DIRECT_URL="" DATABASE_URL="$LPSTACKS_TEST_DATABASE_URL" pnpm db:migrate
          DIRECT_URL="" DATABASE_URL="$LPSTACKS_E2E_DATABASE_URL" pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
